name: Discovery observation (Stage F)

# docs/16 §17.2. Two separate switches, deliberately:
#
#   GATE       repository variable DISCOVERY_OBSERVE_ENABLED == 'true'. Without
#              it NOTHING runs: neither a manual dispatch nor the schedule.
#              Setting it to anything else disables recurring observation.
#   RECURRING  the twice-weekly `schedule:` below (Monday and Thursday; owner
#              decision 2026-10-02, replacing the hourly check). Each
#              invocation only CHECKS the registered, enabled sources (NEURA, XPENG): it
#              observes (never plan, never run-now), and each source's own attributed
#              cadence decides whether anything is fetched (NEURA 48 h; XPENG 120 h, so a
#              Monday slot is due again the next Monday while the Thursday slot, 72 h
#              later, requests nothing). A slot in which a source is not due requests nothing.
#
# Production database access comes only from the `discovery-production`
# environment's secret DISCOVERY_DATABASE_URL: the least-privilege
# `discovery_observer` role (db/roles/discovery_observer.sql), never the owner.
# Mode `plan` makes no manufacturer request and writes nothing.
on:
  schedule:
    - cron: "37 6 * * 1,4"   # Monday and Thursday at 06:37 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = what a cycle would do (no request, no write); observe = run one cycle"
        required: true
        default: plan
        type: choice
        options: [plan, observe]
      source:
        description: "optional: one discovery source key (empty = every source)"
        required: false
        default: ""
        type: string
      run_now:
        description: "run the named source now, skipping ONLY its cadence wait (needs source)"
        required: false
        default: false
        type: boolean

# issues: write is used ONLY by the 'Review queue issue' step (one deduplicated inbox issue).
permissions:
  contents: read
  issues: write

# Never two cycles at once: a second dispatch waits for the first. (Across
# manual CLI runs and this workflow, the database allows one RUNNING run per
# source: uq_crawl_run_one_running_per_source.)
concurrency:
  group: discovery-observe
  cancel-in-progress: false

jobs:
  observe:
    if: vars.DISCOVERY_OBSERVE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: discovery-production
    env:
      DATABASE_URL: ${{ secrets.DISCOVERY_DATABASE_URL }}
      APP_ENV: production
      # A scheduled event has no inputs: it observes EVERY registered source that is enabled
      # AND has an attributed cadence (NEURA and, since 2026-10-03, XPENG), and never skips
      # the cadence wait. A source that is not due requests nothing.
      MODE: ${{ github.event_name == 'schedule' && 'observe' || inputs.mode }}
      ONLY: ${{ github.event_name == 'schedule' && '' || inputs.source }}
      RUN_NOW: ${{ github.event_name == 'schedule' && 'false' || inputs.run_now }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      # The raw-body cache (docs/16 LIVE.10) lives outside the database and is
      # carried between cycles with a rolling cache key. Losing it is safe:
      # conditional headers are sent only while the prior body is present, so a
      # cold cache costs full fetches, never wrong results. Pruning is not run.
      - name: Restore raw-body cache
        uses: actions/cache/restore@v4
        with:
          path: var/discovery/cache
          key: discovery-cache-${{ github.run_id }}
          restore-keys: discovery-cache-
      - name: Install runner dependencies
        working-directory: apps/api
        run: uv sync --frozen --no-dev --group discovery
      - name: Observation cycle
        id: cycle
        working-directory: apps/api
        shell: bash
        run: |
          args=(observe --cache-dir "$GITHUB_WORKSPACE/var/discovery/cache"
                --report-json "$GITHUB_WORKSPACE/var/discovery/observe/cycle.json")
          [ "$MODE" = plan ] && args+=(--plan)
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ "$RUN_NOW" = true ] && args+=(--run-now)   # the CLI refuses it without --only
          set +e
          uv run --no-sync python -m app.cli.discovery "${args[@]}" > "$RUNNER_TEMP/cycle.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/cycle.txt"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # Exit codes (app.services.discovery.observe): 0 no action needed, 4 human review
      # required, anything else an execution failure. G5-4 (owner decision 2026-10-04): only an
      # execution failure turns the job RED. Exit 4 is a SUCCESSFUL discovery that created review
      # work: the job stays green with a ::warning:: annotation and a REVIEW REQUIRED headline,
      # and the persistent attention lives in the 'Discovery review queue' issue below.
      - name: Summary
        if: always()
        shell: bash
        env:
          CODE: ${{ steps.cycle.outputs.code }}
        run: |
          set +e
          python3 scripts/discovery_review_queue.py headline --code "$CODE" > "$RUNNER_TEMP/headline.txt"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/headline.txt"
          head="$(sed 's/^::[a-z]*:://' "$RUNNER_TEMP/headline.txt")"
          {
            echo "## Discovery observation ($MODE${ONLY:+, source $ONLY}$([ "$RUN_NOW" = true ] && echo ', run-now'))"
            echo
            echo "**$head**"
            echo
            echo "Trigger: ${{ github.event_name }} (recurring: Monday and Thursday 06:37 UTC; the source cadence decides fetching)."
            echo
            echo '```'
            cat "$RUNNER_TEMP/cycle.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      # One deduplicated inbox issue. Only after a valid cycle (exit 0 or 4); never after a
      # technical failure, and never from a plan. See scripts/discovery_review_queue.py.
      - name: Review queue issue
        if: always() && env.MODE == 'observe' && (steps.cycle.outputs.code == '0' || steps.cycle.outputs.code == '4')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CODE: ${{ steps.cycle.outputs.code }}
        run: |
          python3 scripts/discovery_review_queue.py issue             --report "$GITHUB_WORKSPACE/var/discovery/observe/cycle.json" --code "$CODE"             --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Save raw-body cache
        if: always() && env.MODE == 'observe'
        uses: actions/cache/save@v4
        with:
          path: var/discovery/cache
          key: discovery-cache-${{ github.run_id }}
      - name: Retain cycle result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: discovery-cycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/discovery/observe/
          if-no-files-found: warn
          retention-days: 30
