[project]
name = "humanoidonline-api"
version = "0.1.0"
description = "HumanoidOnline FastAPI backend (WS1 foundation)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqladmin>=0.19",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

# This is an application, not a distributable package: uv installs only the
# dependencies, and pytest puts the project root on sys.path so `app` imports.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Keep classic typing.Generic for broad Pydantic-generic compatibility.
ignore = ["UP046", "UP047"]
